name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: xargs -a packages.txt sudo apt-get install -y  # system libraries OCR needs
      - run: pip install -r requirements.txt
      - run: python tests/test_engine.py
      - run: python tests/test_receipts.py
